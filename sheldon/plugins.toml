shell = "zsh"

# Utilitaire utilisé par d'autres plugins pour différer leur chargement
[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# Complétions supplémentaires : doivent être ajoutées au fpath AVANT compinit
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
use = ["src"]
apply = ["fpath"]

# Initialise le système de complétion Zsh (requis par zsh-completions et fzf-tab)
[plugins.compinit]
inline = 'autoload -Uz compinit && compinit'

# Doit être chargé APRÈS compinit, et avant autosuggestions/syntax-highlighting
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

# Raccourcis fzf : Ctrl-R (historique), Ctrl-T (fichiers), Alt-C (dossiers).
# Après fzf-tab : fzf reprend Tab pour `**` et lui rend la main sinon.
[plugins.fzf]
inline = '''
if command -v fzf >/dev/null 2>&1; then
    if fzf --zsh >/dev/null 2>&1; then
        source <(fzf --zsh)
    else
        # fzf < 0.48 : raccourcis fournis par le paquet (Debian, puis RHEL-like)
        for _f in /usr/share/doc/fzf/examples/key-bindings.zsh /usr/share/fzf/shell/key-bindings.zsh; do
            [ -f "$_f" ] && source "$_f" && break
        done
        unset _f
    fi
fi
'''

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]

# Doit être chargé en DERNIER parmi les plugins qui modifient des widgets zle
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
use = ["{{ name }}.zsh"]

# Chaque outil n'est initialisé que s'il est installé (pas d'erreur à
# l'ouverture du shell sur une machine où il manque)
[plugins.starship]
inline = 'command -v starship >/dev/null 2>&1 && eval "$(starship init zsh)"'

# `cd` devient zoxide : il retient les dossiers visités (`cd proj` y saute,
# `cdi` ouvre un choix interactif). Hors shell interactif et dans Claude Code,
# `cd` reste la commande native et zoxide garde ses noms `z` / `zi`.
[plugins.zoxide]
inline = '''
if command -v zoxide >/dev/null 2>&1; then
    if [[ -o interactive && -z "${CLAUDECODE:-}" ]]; then
        eval "$(zoxide init zsh --cmd cd)"
    else
        eval "$(zoxide init zsh)"
    fi
fi
'''
